services:
  - type: web
    name: ai-901-study-studio-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt -r requirements-azure.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: AI901_MODE
        value: auto
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CORS_ORIGINS
        sync: false
